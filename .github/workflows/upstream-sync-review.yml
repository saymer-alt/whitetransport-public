# Review-only: never merge into the fork default branch automatically.
# v2: tracks both the upstream default branch AND published stable releases/tags.
# The sync logic lives in .github/scripts/upstream-sync-review.sh (tested
# locally against synthetic Git repositories; see KAS fork-sync docs).
name: Upstream sync review
on:
  schedule:
    - cron: '31 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-sync-review-${{ github.repository }}
  cancel-in-progress: false
jobs:
  propose-sync:
    if: github.repository == 'saymer-alt/whitetransport-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout fork default branch
        # actions/checkout v4.2.2, pinned by commit SHA (supply-chain hardening).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'main'
          fetch-depth: 0
          filter: blob:none
      - name: Compare upstream and open/update draft-only sync proposals
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REPO: 'meanwebuser/whitetransport-public'
          BRANCH: 'main'
        run: bash .github/scripts/upstream-sync-review.sh
